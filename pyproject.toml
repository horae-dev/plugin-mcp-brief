[project]
name = "horae-plugin-mcp-brief"
version = "0.1.0"
description = "Horae plugin: call a brief() tool on any MCP service. Holds the brief() contract."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_brief"]

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "mcp>=2.3,<3",
    "mypy>=2.4",
    "pytest>=9.1",
    "pytest-cov>=7",
    "ruff>=0.17",
    "types-jsonschema>=4",
]

[tool.uv]
required-version = ">=0.13"
exclude-newer = "7 days"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests", "examples", "scripts"]
python_version = "3.12"
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["mcp_brief"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]
